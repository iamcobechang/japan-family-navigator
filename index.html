<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan Family Navigator</title><style>body{font-family:system-ui;margin:0;background:#f2f5fa;color:#173451}header{background:#173451;color:white;padding:24px}main{padding:18px;max-width:720px;margin:auto}button,a{display:inline-block;border:0;border-radius:12px;padding:13px;margin:5px;background:#e2edfa;color:#123f71;font:inherit;text-decoration:none}button.active,a{background:#1766ac;color:white}.card{background:white;border-radius:16px;padding:18px;margin:12px 0}small{color:#678}</style><header><h1>🇯🇵 Japan Family Navigator</h1><p>2027/1/16–1/20 · 東京與越後湯澤</p></header><main><h2>選擇日期</h2><div id="days"></div><h2>使用情境</h2><div id="scenes"></div><div id="detail"></div></main><script>const items=[['1/16','✈️ 成田機場入境','Narita International Airport','入境審查|領取行李|確認鐵路搭車位置','鉄道の駅はどこですか？','鐵路車站在哪裡？'],['1/16','🚆 機場鐵路與東京轉乘','Tokyo Station','確認班次與車票|核對月台|前往東京','東京駅までお願いします。','請到東京站。'],['1/17','🚄 上越新幹線','Echigo-Yuzawa Station','確認車次|前往月台|抵達越後湯澤','越後湯沢行きは何番線ですか？','往越後湯澤在哪個月台？'],['1/17','🏨 Angel Grandia 飯店','Angel Grandia Echigo Nakazato','確認接駁車時刻|搭車|辦理入住','送迎バスはどこですか？','接駁車在哪裡？'],['1/18','❄️ 玩雪與租借','Angel Grandia Echigo Nakazato','確認雪場開放|租借裝備|前往玩雪區','雪遊び用品を借りたいです。','我想租玩雪裝備。'],['1/19','🚄 返回東京','Tokyo Station','退房|搭新幹線|前往東京飯店','東京までの切符をお願いします。','請給我到東京的車票。'],['1/19','⛩️ 淺草觀光','Sensoji Temple Tokyo','前往淺草|參觀|附近用餐','浅草寺へ行きたいです。','我想去淺草寺。'],['1/20','✈️ 成田返台 CI105','Narita International Airport','確認航廈|前往機場|辦理報到','チャイナエアラインのカウンターはどこですか？','華航櫃檯在哪裡？']];let day='1/16';function show(){document.querySelector('#days').innerHTML=['1/16','1/17','1/18','1/19','1/20'].map(d=>'<button data-day="'+d+'" class="'+(day===d?'active':'')+'">'+d+'</button>').join('');document.querySelector('#scenes').innerHTML=items.map((x,i)=>x[0]===day?'<button data-i="'+i+'">'+x[1]+'</button>':'').join('');document.querySelector('#detail').innerHTML='<div class="card">請選擇上方情境。</div>';document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;show()});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let x=items[Number(b.dataset.i)];let q=encodeURIComponent(x[2]);document.querySelector('#detail').innerHTML='<div class="card"><h2>'+x[1]+'</h2>'+x[3].split('|').map((s,i)=>'<p>'+(i+1)+'. '+s+'</p>').join('')+'<a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+q+'">📍 地圖</a><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+q+'">🧭 導航</a><h3>情境日文</h3><p lang="ja">'+x[4]+'</p><p>'+x[5]+'</p><button id="voice">🔊 播放日文</button></div>';document.querySelector('#voice').onclick=()=>{let u=new SpeechSynthesisUtterance(x[4]);u.lang='ja-JP';speechSynthesis.speak(u)}})}show();</script></html>
