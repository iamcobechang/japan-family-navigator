<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153552"><link rel="manifest" href="./manifest.webmanifest"><title>Japan Family Navigator v5</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{padding:27px 20px;background:linear-gradient(135deg,#16334f,#276a96);color:white}header h1{font-size:24px;margin:8px 0}header p{margin:5px 0;color:#dceafa}main{max-width:720px;margin:auto;padding:16px}.days{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.days button{flex:1;min-width:66px}.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{cursor:pointer;border:1px solid #dce6ef;background:#fff;color:#17324d;border-radius:13px;padding:12px;font:inherit}button.active{background:#1663a4;color:white;border-color:#1663a4}.scenes button{text-align:left;min-height:82px;font-weight:650}.panel{background:#fff;border:1px solid #e2e9f0;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 3px 18px #1234560b}h2{font-size:19px}h3{font-size:17px}.muted{font-size:13px;color:#61758a}.progress{height:8px;border-radius:10px;background:#e5edf5;overflow:hidden}.progress div{height:100%;background:#2384b9}.diagram{border-radius:16px;background:#eaf4fa;padding:20px;margin:16px 0;text-align:center}.diagram .symbol{font-size:43px}.diagram .path{font-size:13px;color:#2b5877;margin-top:8px}.jp{font-size:19px;font-weight:650;line-height:1.5}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons button,.buttons a{flex:1;min-width:110px;text-align:center}.primary,a{background:#1767a8;color:#fff;border:0;border-radius:12px;padding:12px;text-decoration:none;display:inline-block}.warn{background:#fff2d8;color:#805500;border-radius:10px;padding:11px;font-size:13px}.foot{color:#647a8f;font-size:12px;padding:20px;text-align:center}.assist{border:1px solid #b9d7ec;background:#f1f8fd;border-radius:14px;padding:14px;margin-top:18px}.assist h3{margin:0 0 8px}.assist input{width:100%;max-width:100%;margin:10px 0}.assist img{display:block;max-width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin:10px auto}.assist .secondary{font-size:13px;color:#47647b}.assist .fallback{background:#fff;border-radius:10px;padding:12px;margin-top:12px;line-height:1.6}.assist a{background:#1767a8;color:white;display:inline-block;margin-top:8px}.assist .voice{display:flex;gap:8px;align-items:center;margin:8px 0}.assist .voice select{flex:1;padding:10px;border-radius:9px;border:1px solid #dce6ef;background:white}.assist .privacy{font-size:12px;color:#805500;margin-top:8px}.realguide{background:#fff;border:1px solid #dce6ef;border-radius:18px;padding:15px;margin:16px 0}.realguide img{width:100%;height:auto;border-radius:12px;background:#edf2f6;display:block}.realguide figure{margin:12px 0 20px}.realguide figcaption{font-size:13px;line-height:1.55;margin-top:8px}.realguide .tag{display:inline-block;background:#e8f3ff;color:#135c9b;padding:5px 9px;border-radius:8px;font-size:12px}.realguide a{font-size:13px}.realguide .photo-note{color:#61758a;font-size:12px}</style></head><body><header><small>2027.01.16 — 01.20 · 家庭四人</small><h1>🇯🇵 Japan Family Navigator</h1><p>選情境 → 實景對照／拍照 → 文字備援 → 日文播放</p></header><main><h2>今天要去哪裡？</h2><div id="days" class="days"></div><h2>選擇情境</h2><div id="scenes" class="scenes"></div><div id="detail"></div></main><div class="foot">v5 · 現場照片可交由 ChatGPT Plus 輔助辨識；App 尚未自動辨識。畫面為示意指引，非機場或車站官方平面圖。班次、月台、出口與營業狀況以當日現場資訊為準。</div><script>const flows=[{"day":"1/16","name":"✈️ 成田機場入境","place":"Narita International Airport Japan","steps":[["下機後找入境指標","跟著 Arrivals / Immigration 標示走。先確認實際抵達航廈，不預設航廈或出口。","到着ロビーはどちらですか？","抵達大廳往哪裡走？","Arrivals → Immigration"],["入境審查","準備四人的護照與入境資料；依現場人員指示排隊，未成年人跟隨家長。","家族四人です。","我們是一家四口。","Passport → Immigration"],["領取托運行李","看航班 CI100 對應的行李轉盤；確認四人的行李數量。","CI100の荷物受取所はどこですか？","CI100 的行李領取處在哪裡？","Baggage Claim"],["海關與抵達大廳","依申報情況完成海關流程，走向 Arrival Lobby，找鐵路標誌。","鉄道の駅はどこですか？","鐵路車站在哪裡？","Customs → Railway"],["確認進市區交通","依第一晚實際住宿決定搭 N'EX 或其他鐵路。先查票價、車次與轉乘，不預設直達。","切符売り場はどこですか？","售票處在哪裡？","Railway Tickets"]]},{"day":"1/16","name":"🏨 第一晚住宿（待確認）","place":"Ueno Station Tokyo Japan","steps":[["確認實際飯店","第一晚尚未有確認訂房資料。請先確認飯店名稱、地址與入住日期。","ホテルの住所を確認したいです。","我想確認飯店地址。","Booking confirmation"],["前往飯店","確定飯店後再使用步行導航；不要以候選飯店當作已訂房地點。","このホテルへ行きたいです。","我想去這間飯店。","Station → Hotel"],["辦理入住","準備訂房姓名、護照與確認信；詢問早餐及退房時間。","予約しています。チェックインをお願いします。","我有預訂，想辦理入住。","Reception"]]},{"day":"1/16","name":"🍽️ 上野晚餐（候選）","place":"Yakiniku Taishoen Ueno Tokyo Japan","steps":[["確認營業及座位","燒肉太昌園是候選餐廳，請先確認分店、營業時間與是否需要訂位。","今、四人で入れますか？","現在四位可以入座嗎？","Restaurant entrance"],["點餐與結帳","確認兒童可吃的料理、份量與付款方式。","子ども向けのメニューはありますか？","有兒童適合的菜單嗎？","Menu → Checkout"]]},{"day":"1/17","name":"🚄 上越新幹線","place":"Echigo-Yuzawa Station Japan","steps":[["從東京出發","依第一晚飯店位置選擇出發車站；查看當天上越新幹線班次與指定席。","越後湯沢まで行きたいです。","我要去越後湯澤。","JR Shinkansen"],["核對車次與月台","比對票面日期、車次、出發時間、車廂與座位；月台以電子看板為準。","この列車は越後湯沢に停まりますか？","這班車有停越後湯澤嗎？","Departure board"],["抵達越後湯澤","下車清點四人的行李，依站內標示往西口方向。","西口はどちらですか？","西口在哪裡？","West Exit"]]},{"day":"1/17","name":"🏨 Angel Grandia 入住","place":"Angel Grandia Echigo Nakazato Yuzawa Japan","steps":[["尋找飯店接駁","先到越後湯澤站西口案內所附近，核對飯店官方接駁車候車位置與當日時刻。","エンゼルグランディアの送迎バスはどこですか？","Angel Grandia 接駁車在哪裡？","West Exit → Shuttle"],["搭車與入住","確認車身飯店名稱；抵達後出示預約資料，確認兩晚住宿及早晚餐。","二泊の予約をしています。","我們有預訂兩晚。","Shuttle → Reception"]]},{"day":"1/18","name":"❄️ 雪樂園與裝備","place":"Angel Grandia Echigo Nakazato Yuzawa Japan","steps":[["確認開放與租借","先確認ゆきゆきランド當日開放、積雪與租借櫃檯；四人尺寸與費用以現場為準。","雪遊びのレンタル受付はどこですか？","玩雪裝備租借櫃檯在哪裡？","Rental counter"],["穿戴與入場","檢查雪衣、手套、防水鞋；留意兒童保暖與活動區安全標示。","子ども用のサイズはありますか？","有兒童尺寸嗎？","Gear → Snow park"]]},{"day":"1/19","name":"🚄 湯澤返回東京","place":"Tokyo Station Japan","steps":[["退房與接駁","先確認退房時間、接駁班次與車站所需時間。","駅までの送迎バスは何時ですか？","到車站的接駁車幾點？","Hotel → Station"],["搭新幹線回東京","核對當天班次、車廂及座位，抵達後依確定住宿地點導航。","東京方面のホームはどこですか？","往東京的月台在哪裡？","Shinkansen → Tokyo"]]},{"day":"1/19","name":"⛩️ 淺草觀光與住宿","place":"Sensoji Temple Asakusa Tokyo Japan","steps":[["淺草寺觀光","查看地圖前往雷門、仲見世與淺草寺；注意人潮與孩子集合點。","浅草寺へはどう行きますか？","淺草寺怎麼走？","Kaminarimon → Sensoji"],["晚間入住","東京最後一晚飯店尚待確認，不能直接使用候選飯店導航。","チェックインをお願いします。","我們要辦理入住。","Hotel reception"]]},{"day":"1/20","name":"✈️ 成田返台 CI105","place":"Narita International Airport Japan","steps":[["退房與前往機場","先確認飯店、出發站與交通班次，預留轉乘、行李及報到時間。","成田空港までの行き方を教えてください。","請告訴我去成田機場的方法。","Hotel → Airport"],["核對航廈與報到","CI105 預定 17:45 起飛；出發前以華航官方資訊核對航廈及櫃檯。","チャイナエアラインのカウンターはどこですか？","華航櫃檯在哪裡？","Check-in → Security"]]}];const dates=["1/16","1/17","1/18","1/19","1/20"];let date=0,scene=-1,step=0;const $=id=>document.getElementById(id);function nav(place,route){return "https://www.google.com/maps/"+(route?"dir/":"search/")+"?api=1&"+(route?"destination=":"query=")+encodeURIComponent(place)}function draw(){ $("days").innerHTML=dates.map((d,i)=>'<button data-date="'+i+'" class="'+(i===date?"active":"")+'">'+d+'</button>').join("");$("scenes").innerHTML=flows.map((f,i)=>f.day===dates[date]?'<button data-scene="'+i+'" class="'+(scene===i?"active":"")+'">'+f.name+'</button>':"").join("");const f=flows[scene];if(!f){$("detail").innerHTML='<div class="panel muted">請選擇上方情境，查看每一步的詳細畫面。</div>'}else{const s=f.steps[step],percent=Math.round((step+1)/f.steps.length*100);$("detail").innerHTML=(scene===0?"<section class=\"realguide\"><span class=\"tag\">官方照片導覽 · 成田 T2</span><h2>✈️ CI100 抵達後：一步一步走到鐵路</h2><p>華航目前使用成田第 2 航廈。實際 CI100 抵達航廈與到達大廳 A／B 請於出發前及落地時再次確認。</p><h3>① 下機 → 入境審查</h3><p>跟隨 <strong>Arrivals / Immigration / 到着</strong> 指標，不走 International Transfer。依現場動線完成入境審查。不同登機門可能走不同通道，這段尚無已核實的逐轉角照片。</p><h3>② 入境 → 行李 → 海關</h3><p>依序尋找 <strong>Baggage Claim / 手荷物受取</strong>，在看板確認 CI100 行李轉盤，再完成 Customs / 税関。完成海關後才進入 1F 公共到達大廳。</p><h3>③ 1F 到達大廳 → B1F 鐵路</h3><p>看你從 <strong>Arrival Lobby A 或 B</strong> 出來，沿 <strong>Railway / 鉄道</strong> 標誌下到 <strong>B1F</strong>，直走至 JR 或京成的售票／閘口區。不要走到 3F 出境報到大廳。</p><figure><img loading=\"lazy\" src=\"https://narita.imagewave.pictures/DNZHjeZjZYdJQ71Q5yDg7Q/zxPMuVzAQNyVyezNXuh4o5/width%3D3840\" alt=\"成田機場官方照片：到達大廳 A → B1F\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='照片暫時無法載入，請開啟下方機場官方圖文導覽查看。'\"><figcaption>1. 到達大廳 A → B1F｜成田機場官方實景照片</figcaption></figure><figure><img loading=\"lazy\" src=\"https://narita.imagewave.pictures/DNZHjeZjZYdJQ71Q5yDg7Q/2TScaEGjL3Ux7ytSWwH2J6/width%3D3840\" alt=\"成田機場官方照片：到達大廳 B → B1F\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='照片暫時無法載入，請開啟下方機場官方圖文導覽查看。'\"><figcaption>2. 到達大廳 B → B1F｜成田機場官方實景照片</figcaption></figure><figure><img loading=\"lazy\" src=\"https://narita.imagewave.pictures/DNZHjeZjZYdJQ71Q5yDg7Q/Lw4FeDQWVBZoVLiKCp7iXD/width%3D3840\" alt=\"成田機場官方照片：B1F 鐵路方向指標\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='照片暫時無法載入，請開啟下方機場官方圖文導覽查看。'\"><figcaption>3. B1F 鐵路方向指標｜成田機場官方實景照片</figcaption></figure><figure><img loading=\"lazy\" src=\"https://narita.imagewave.pictures/DNZHjeZjZYdJQ71Q5yDg7Q/uenCrRWqRxWiboRDKP4BYF/width%3D3840\" alt=\"成田機場官方照片：JR／京成票閘入口\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='照片暫時無法載入，請開啟下方機場官方圖文導覽查看。'\"><figcaption>4. JR／京成票閘入口｜成田機場官方實景照片</figcaption></figure><p class=\"photo-note\">圖片引用自成田機場官方公開導覽，可能因網站防嵌入、更新或網路狀況無法載入。圖片不保證是 CI100 當日抵達路線。</p><div class=\"buttons\"><a target=\"_blank\" rel=\"noopener\" href=\"https://www.narita-airport.jp/en/access/train/railway-route-2/\">查看機場官方照片與箭頭</a><a target=\"_blank\" rel=\"noopener\" href=\"https://www.narita-airport.jp/en/airportguide/inter-arr/\">查看官方入境流程</a></div><p class=\"warn\">JR 與京成是不同公司。前往哪一個票閘，需依當天確定的目的地與車票決定。</p></section>":"")+'<section class="panel"><div class="muted">'+f.day+' · '+f.name+'</div><h2>第 '+(step+1)+' / '+f.steps.length+' 步</h2><div class="progress"><div style="width:'+percent+'%"></div></div><div class="diagram"><div class="symbol">'+f.name.slice(0,2)+'</div><strong>'+s[0]+'</strong><div class="path">'+s[4]+'</div><div class="muted">流程示意圖 · 請依現場標示行走</div></div><h3>現在怎麼做</h3><p>'+s[1]+'</p>'+(f.name.includes("待確認")||f.name.includes("候選")||f.name.includes("住宿")?'<div class="warn">飯店或餐廳可能尚未確認，請先核對最終預訂資料。</div>':"")+'<h3>現場日文</h3><p class="jp" lang="ja">'+s[2]+'</p><p>'+s[3]+'</p><div class="voice"><label for="voiceRate">語音速度</label><select id="voiceRate"><option value="0.85">正常</option><option value="0.65">慢速</option></select></div><div class="buttons"><button id="speak">🔊 播放日文</button><button id="copy">複製日文</button></div><div class="buttons" style="margin-top:12px"><a target="_blank" rel="noopener" href="'+nav(f.place,false)+'">📍 地圖</a><a target="_blank" rel="noopener" href="'+nav(f.place,true)+'">🧭 導航</a></div><section class="assist"><h3>📷 現場拍照助手</h3><p class="secondary">拍攝售票機、指標、車票或菜單。照片僅在本機預覽，不會由本站上傳或自動辨識。</p><input id="photo" type="file" accept="image/*" capture="environment" aria-label="拍照或選取現場照片"><div id="photoPreview"></div><div class="fallback"><strong>辨識不確定時：先看文字指引</strong><p>'+s[1]+'</p><p>現場可尋找：<strong>'+s[4]+'</strong></p><p class="secondary">若日期、票種、目的地或金額無法核對，先不要付款或按下確認。</p></div><div class="buttons"><button id="prompt">📋 複製辨識問題</button><a href="https://chatgpt.com/" target="_blank" rel="noopener">開啟 ChatGPT</a></div><p class="secondary">使用方式：先拍照，再開啟 ChatGPT，手動附上照片並貼上辨識問題。Plus 與本站尚未自動連線。</p><p class="privacy">⚠️ 上傳前請遮蔽護照、QR Code、姓名與付款資料。</p></section><div class="buttons" style="margin-top:16px"><button id="prev" '+(step===0?"disabled":"")+'>← 上一步</button><button id="next" class="primary">'+(step===f.steps.length-1?"✓ 完成情境":"完成，下一步 →")+'</button></div></section>'; $("speak").onclick=()=>{if(!window.speechSynthesis){alert("目前瀏覽器不支援語音");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s[2]);u.lang="ja-JP";u.rate=Number($("voiceRate").value);speechSynthesis.speak(u)};$("copy").onclick=()=>navigator.clipboard?.writeText(s[2]).then(()=>alert("已複製日文")).catch(()=>alert("請長按日文複製"));let previewUrl=null; $("photo").onchange=e=>{const file=e.target.files?.[0];if(previewUrl)URL.revokeObjectURL(previewUrl);if(!file){$("photoPreview").replaceChildren();return}if(!file.type.startsWith("image/")){alert("請選擇照片");return}previewUrl=URL.createObjectURL(file);const img=document.createElement("img");img.src=previewUrl;img.alt="剛拍攝的現場照片（僅本機預覽）";$("photoPreview").replaceChildren(img)};$("prompt").onclick=async()=>{const q="我正在日本家庭旅行，情境："+f.name+"；目前步驟："+s[0]+"。目的："+s[1]+"。請根據我接下來附上的真實照片，辨識可見日文、按鈕與方向；優先指出下一步。如無法確認按鈕位置，請先提供日文原文與中文文字指引，不要猜測；若涉及付款、日期、票種或目的地衝突，請提醒我先核對。";try{await navigator.clipboard.writeText(q);alert("辨識問題已複製。請到 ChatGPT 附上照片並貼上問題。")}catch(e){window.prompt("請複製這段辨識問題",q)}};$("prev").onclick=()=>{step=Math.max(0,step-1);draw()};$("next").onclick=()=>{if(step<f.steps.length-1){step++;draw()}else{scene=-1;step=0;draw()}}}document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{date=+b.dataset.date;scene=-1;step=0;draw()});document.querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{scene=+b.dataset.scene;step=0;draw();$("detail").scrollIntoView({behavior:"smooth",block:"start"})})}draw();</script></body></html>
